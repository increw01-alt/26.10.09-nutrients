<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="비타민D와 칼슘 영양제 병 두 개와 좋은 궁합 표시 일러스트">
  <defs>
    <linearGradient id="pGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7f4b"/><stop offset="1" stop-color="#244d2c"/></linearGradient>
    <linearGradient id="pWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1ede4"/></linearGradient>
    <linearGradient id="pPlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe9dc"/><stop offset="1" stop-color="#e3dccb"/></linearGradient>
  </defs>
  <!-- 받침·그림자 -->
  <ellipse cx="320" cy="470" rx="240" ry="26" fill="url(#pPlate)"/>
  <ellipse cx="320" cy="464" rx="200" ry="14" fill="rgba(28,27,24,.08)"/>
  <!-- 뒤쪽 잎 -->
  <g transform="translate(60 250) rotate(200)"><path d="M0 0 C 40 -60, 120 -66, 150 -14 C 115 26, 40 36, 0 0 Z" fill="#9cc6a4"/></g>
  <g transform="translate(470 150) rotate(-30)"><path d="M0 0 C 40 -70, 130 -80, 170 -20 C 130 30, 40 40, 0 0 Z" fill="#3a7d44"/><path d="M8 -4 C 50 -30, 110 -40, 160 -22" stroke="rgba(255,255,255,.45)" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(500 230) rotate(-5)"><path d="M0 0 C 40 -60, 120 -66, 150 -14 C 115 26, 40 36, 0 0 Z" fill="#6ea87a"/></g>
  <!-- 1. 흰 병 (VITAMIN D) -->
  <g>
    <rect x="166" y="146" width="66" height="26" rx="6" fill="#e6b53f"/>
    <rect x="172" y="170" width="54" height="12" fill="#efe9dc"/>
    <rect x="144" y="180" width="110" height="274" rx="26" fill="url(#pWhite)" stroke="rgba(28,27,24,.08)"/>
    <rect x="144" y="236" width="110" height="104" fill="#f6d27a"/>
    <text x="199" y="274" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="800" fill="#2b2a26" letter-spacing=".08em">VITAMIN D</text>
    <text x="199" y="296" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#5a4a1c">1000 IU</text>
    <text x="199" y="320" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="9" font-weight="600" fill="#8a6b2a">60 CAPSULES</text>
    <rect x="156" y="192" width="8" height="244" rx="4" fill="rgba(255,255,255,.7)"/>
  </g>
  <!-- 2. 진녹색 병 (CALCIUM) -->
  <g>
    <rect x="408" y="186" width="66" height="26" rx="6" fill="#1b3a21"/>
    <rect x="390" y="208" width="102" height="246" rx="24" fill="url(#pGreen)"/>
    <rect x="390" y="266" width="102" height="96" fill="#f6f2ea"/>
    <text x="441" y="302" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="800" fill="#2b2a26" letter-spacing=".08em">CALCIUM</text>
    <text x="441" y="324" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#6b675f">+ Magnesium 2:1</text>
    <text x="441" y="346" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="9" font-weight="600" fill="#8f8b82">90 TABLETS</text>
    <rect x="402" y="222" width="8" height="212" rx="4" fill="rgba(255,255,255,.22)"/>
  </g>
  <!-- 가운데 + 배지 -->
  <circle cx="322" cy="330" r="38" fill="#fbfaf6" stroke="rgba(28,27,24,.08)"/>
  <circle cx="322" cy="330" r="30" fill="#3a7d44"/>
  <rect x="318" y="314" width="8" height="32" rx="4" fill="#fff"/>
  <rect x="306" y="326" width="32" height="8" rx="4" fill="#fff"/>
  <!-- 궁합 결과 칩 -->
  <g transform="translate(248 96)">
    <rect x="0" y="0" width="148" height="44" rx="22" fill="#ffffff" stroke="#c5dfc9"/>
    <circle cx="24" cy="22" r="12" fill="#3a7d44"/>
    <path d="M18 22 l4 4 l8 -9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="27" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="800" fill="#2f6538">좋은 궁합</text>
  </g>
  <!-- 앞쪽 잎 -->
  <g transform="translate(40 440) rotate(-15)"><path d="M0 0 C 40 -60, 120 -66, 150 -14 C 115 26, 40 36, 0 0 Z" fill="#4b8c59"/><path d="M8 -2 C 50 -22, 100 -30, 142 -16" stroke="rgba(255,255,255,.45)" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(560 455) rotate(190)"><path d="M0 0 C 40 -60, 120 -66, 150 -14 C 115 26, 40 36, 0 0 Z" fill="#6ea87a"/></g>
  <!-- 캡슐·소프트젤 -->
  <g transform="translate(290 426) rotate(-20)"><rect x="0" y="0" width="34" height="14" rx="7" fill="#f3b23e"/><path d="M17 0h10a7 7 0 0 1 0 14H17z" fill="#f6d27a"/></g>
  <g transform="translate(350 446) rotate(25)"><ellipse cx="0" cy="0" rx="16" ry="9" fill="#f6c43d"/><ellipse cx="-5" cy="-3" rx="5" ry="2.5" fill="rgba(255,255,255,.6)"/></g>
  <g transform="translate(520 430)"><circle cx="0" cy="0" r="11" fill="#e9e3d6"/><path d="M-7 0h14" stroke="rgba(28,27,24,.18)" stroke-width="2" stroke-linecap="round"/></g>
</svg>
