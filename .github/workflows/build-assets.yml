name: Build assets (Tailwind CSS · icons)

# HTML·JS·템플릿이 바뀌면 Tailwind 정적 CSS 와 아이콘 번들을 다시 만들어 커밋한다.
# (로컬에 Node 가 없어도 push 만 하면 1~2분 뒤 자동 반영)
on:
  push:
    branches: [claude/supplement-info-compatibility-site-1o2qrj]
    paths:
      - "**/*.html"
      - "assets/js/**"
      - "assets/css/tailwind.src.css"
      - "tailwind.config.cjs"
      - "scripts/build_site.py"
      - "scripts/build_icons.mjs"
      - "data/ingredients.json"
      - "data/interactions.json"
      - "data/guides.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 자동 커밋이 다시 워크플로를 깨우지 않도록
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run assets
      - run: pip install -r requirements.txt && python scripts/build_site.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/meta.json 의 builtAt 시각만 바뀐 경우는 커밋하지 않음 (실제 CSS·아이콘·HTML 변경이 있을 때만)
          git add -A
          git reset -q data/meta.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(assets): Tailwind CSS·아이콘 번들 재생성"
          git push
