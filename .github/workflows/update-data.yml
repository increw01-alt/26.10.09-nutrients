name: Update data (products · drugs · news · deeplinks · static pages)

on:
  schedule:
    - cron: "15 18 * * *"        # 매일 03:15 KST
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유"
        required: false
        default: "manual"
      products_max_rows:
        description: "제품 수집 행 수 (비우면 기본 15,000 = 최근 약 5년. 0 = 전체 약 46,000건, 20~30분 — 과거 제품까지 검색하려면 한 번만 0 으로 실행)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        timeout-minutes: 5
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/fetch_news.py

      - name: Fetch functional materials (MFDS)
        timeout-minutes: 10
        env:
          CI: "true"
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
        run: python scripts/fetch_materials.py

      - name: Fetch products (MFDS)
        timeout-minutes: 40
        env:
          CI: "true"
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
          FOODSAFETY_SERVICE: ${{ vars.FOODSAFETY_SERVICE }}
          FOODSAFETY_MAX_ROWS: ${{ inputs.products_max_rows || vars.FOODSAFETY_MAX_ROWS }}
        run: python scripts/fetch_products.py

      - name: Fetch drugs (MFDS e약은요 · 허가정보)
        timeout-minutes: 25   # 스크립트 시간 예산(DRUG_TIME_BUDGET 기본 1200초) + 저장 여유
        env:
          CI: "true"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DRUG_API_BUDGET: ${{ vars.DRUG_API_BUDGET }}
          DRUG_EASY_SERVICE: ${{ vars.DRUG_EASY_SERVICE }}       # API 경로가 바뀌면 Variables 로 덮어쓰기 (기본 DrbEasyDrugInfoService/getDrbEasyDrugList)
          DRUG_PERMIT_SERVICE: ${{ vars.DRUG_PERMIT_SERVICE }}   # 기본 DrugPrdtPrmsnInfoService08/getDrugPrdtPrmsnInq08 (06 폐기)
          DRUG_RX_BUDGET: ${{ vars.DRUG_RX_BUDGET }}             # 전문의약품(처방약) 허가 목록 수집에 쓸 호출 수 (기본 300, 0 이면 끔)
        run: python scripts/fetch_drugs.py

      - name: Build Coupang deeplinks
        timeout-minutes: 5
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
        run: python scripts/build_affiliate_links.py

      - name: Set up Node (Tailwind CSS · icons)
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Rebuild Tailwind CSS & icon bundle
        timeout-minutes: 5
        run: npm ci && npm run assets

      - name: Build static pages & sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_site.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # 데이터뿐 아니라 그 데이터로 다시 그린 생성 페이지(guide/·function/·compare/·drug-guide/·term/·허브·sw.js·해시 스탬프)까지 함께 커밋
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore(data): 자동 데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
