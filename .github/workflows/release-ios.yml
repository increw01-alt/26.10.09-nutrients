# iOS 서명 빌드 + TestFlight 업로드 — 수동 실행만(Actions → release-ios → Run workflow). Mac 없이 xcodebuild 자동 서명(App Store Connect API 키,
# 클라우드 관리 배포 인증서)으로 아카이브 → IPA 내보내기 → `xcrun altool --upload-app` 으로 TestFlight 업로드.
# Secrets: ASC_KEY_ID·ASC_ISSUER_ID·ASC_PRIVATE_KEY_BASE64(.p8 내용 base64)·APPLE_TEAM_ID — 만드는 법은 docs/app-release-ios.md 2·3절. 키 역할은 Admin.
# 버전(CFBundleShortVersionString) = app/package.json 의 version, 빌드 번호(CFBundleVersion) = 이 워크플로의 실행 번호(run_number).
# 워크플로 파일명을 바꾸면 번호가 1부터 다시 시작해 App Store Connect 가 거부하므로 바꾸지 않는다. 이미 올린 실행은 Re-run 하지 말고 새로 실행한다.
name: release-ios

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Secrets 확인
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY_B64" ] || missing="$missing ASC_PRIVATE_KEY_BASE64"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets 가 없음:$missing — docs/app-release-ios.md 2·3절대로 등록한 뒤 다시 실행"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Capacitor 동기화
        working-directory: app
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -version

      - name: API 키 파일 준비
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          # altool 은 --apiKey 를 받아도 키 파일을 ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8 에서 찾는다
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_B64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

      - name: 아카이브 (서명 없음 — 서명은 내보내기 단계에서)
        working-directory: app/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 자동 서명으로 아카이브하면 Xcode 가 '개발용' 프로파일을 만들려 하고, 그러려면 팀에 등록된 기기가 필요하다(Mac·등록 기기 없음 → 실패).
          # 배포용 ID 를 직접 지정하는 것도 자동 서명과 충돌한다. 그래서 build-ios.yml 과 같은 서명 없는 아카이브를 만들고,
          # 다음 단계의 -exportArchive(자동 서명, App Store 프로파일은 기기 불필요)가 API 키로 배포 인증서·프로파일을 만들어 서명한다.
          VERSION_NAME=$(node -p "require('../../package.json').version")
          set -o pipefail
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -40

      - name: IPA 내보내기
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -20
          ls -l "$RUNNER_TEMP/export"
          test -f "$RUNNER_TEMP/export/App.ipa"

      - name: TestFlight 업로드
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: API 키 삭제
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: 실패 로그 보존 (xcodebuild 전체 출력 — 화면에는 끝 40줄만 보이므로)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 30
          if-no-files-found: error
